{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block body %}
<div class="card login">
  <h1>SalesParser</h1>
  <p class="sub" style="margin-top:0">Сравнение цен по сайтам-источникам</p>
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <input type="text" name="login" placeholder="Логин" autocomplete="username" required autofocus>
    <input type="password" name="password" placeholder="Пароль" autocomplete="current-password" required>
    {% if error %}<div class="notice err">Неверный логин или пароль</div>{% endif %}
    <button type="submit">Войти</button>
  </form>
</div>
{% endblock %}
