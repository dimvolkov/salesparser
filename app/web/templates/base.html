<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Сравнение цен{% endblock %} · SalesParser</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="logo" href="/">SalesParser</a>
  {% set me = request.state.user %}
  {% if me %}
  <nav>
    <a href="/">Каталог</a>
    {% if me.can_edit %}<a href="/admin">Админка</a>{% endif %}
  </nav>
  <div class="meta">{% block meta %}{% endblock %}</div>
  <div class="user">
    <a href="/profile" title="{{ me.role_title }}">{{ me.name }}</a>
    <form class="inline" method="post" action="/logout"><button class="btn-ghost" type="submit">Выйти</button></form>
  </div>
  {% endif %}
</header>
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
